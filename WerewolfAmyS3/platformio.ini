; WerewolfAmyS3 — PlatformIO build
;
;   pio run                 build
;   pio run -t upload       flash firmware
;   scripts/flash_soundfont.sh soundfonts/MIRACLE.sf2   flash the GM soundfont
;
; The AMY engine is pulled from git. To use a local checkout instead, replace
; the lib_deps URL with a symlink:  lib_deps = symlink:///path/to/amy

[platformio]
src_dir = .

[env:werewolf-s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.partitions = partitions_werewolf_16MB.csv
board_build.arduino.memory_type = qio_opi   ; N16R8: octal PSRAM
board_upload.flash_size = 16MB

build_flags =
    -DBOARD_HAS_PSRAM
    ; native USB in OTG mode so USBMIDI works; serial log stays on UART0
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=0
    ; ---- TFT_eSPI wiring (mirrors User_Setup.h) ----
    -DUSER_SETUP_LOADED=1
    -DILI9341_DRIVER=1
    -DTFT_MISO=13
    -DTFT_MOSI=11
    -DTFT_SCLK=12
    -DTFT_CS=10
    -DTFT_DC=9
    -DTFT_RST=14
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DSUPPORT_TRANSACTIONS=1

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    paulstoffregen/XPT2046_Touchscreen@^1.4
    https://github.com/shorepine/amy.git
