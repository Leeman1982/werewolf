paragraph=Vendored for the MedusaDexed project. This is the Synth_Dexed source exactly as shipped inside the Pico2Dexed repository (synth_dexed/Synth_Dexed), which already carries the RP2350 patches (no CMSIS-DSP / no Teensy AudioStream dependency) plus the small arm_math shim and dexed_if_common.h helper it needs. RASPBERRYPI_PICO is force-defined in dexed.h so no extra build flags are required from the Arduino IDE.
